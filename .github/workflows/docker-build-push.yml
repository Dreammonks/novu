name: Build and Push Docker Images

on:
  push:
    branches:
      - next
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and Worker
        run: |
          pnpm build:api
          pnpm build:worker

      - name: Prepare API deployment bundle
        run: |
          pnpm --filter @novu/api-service deploy --legacy --prod apps/api/deploy
          cp -r apps/api/dist apps/api/deploy/dist
          cp apps/api/src/.example.env apps/api/deploy/dist/.env
          cp apps/api/src/.env.production apps/api/deploy/dist/.env.production
          if [ -f apps/api/deploy/dist/metadata.js ]; then
            sed -i \
              -e 's|../../../packages/shared/dist|../node_modules/@novu/shared/dist|g' \
              -e 's|../../../libs/application-generic/build|../node_modules/@novu/application-generic/build|g' \
              -e 's|../../../libs/dal/dist|../node_modules/@novu/dal/dist|g' \
              apps/api/deploy/dist/metadata.js
          fi

      - name: Prepare Worker deployment bundle
        run: |
          pnpm --filter @novu/worker deploy --legacy --prod apps/worker/deploy
          cp -r apps/worker/dist apps/worker/deploy/dist
          cp apps/worker/src/.example.env apps/worker/deploy/dist/.env
          cp apps/worker/src/.env.production apps/worker/deploy/dist/.env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata for novu-api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novu-api
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Docker metadata for novu-worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novu-worker
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and push novu-api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push novu-worker
        uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
