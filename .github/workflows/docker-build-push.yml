name: Build and Push Docker Images

on:
  push:
    branches:
      - next
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'libs/**'
      - 'packages/**'
      - '!packages/react/**'
      - 'enterprise/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docker-build-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and Worker
        run: |
          pnpm build:api
          pnpm build:worker

      - name: Prepare API deployment bundle
        run: |
          pnpm --filter @novu/api-service deploy --legacy --prod apps/api/deploy
          cp -r apps/api/dist apps/api/deploy/dist
          if [ -f apps/api/deploy/dist/metadata.js ]; then
            sed -i \
              -e 's|../../../packages/shared/dist|../node_modules/@novu/shared/dist|g' \
              -e 's|../../../libs/application-generic/build|../node_modules/@novu/application-generic/build|g' \
              -e 's|../../../libs/dal/dist|../node_modules/@novu/dal/dist|g' \
              apps/api/deploy/dist/metadata.js
          fi

      - name: Prepare Worker deployment bundle
        run: |
          pnpm --filter @novu/worker deploy --legacy --prod apps/worker/deploy
          cp -r apps/worker/dist apps/worker/deploy/dist

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata for novu-api
        id: meta-api
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novu-api
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Docker metadata for novu-worker
        id: meta-worker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/novu-worker
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and push novu-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push novu-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
